<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body {
            background-image: url(background_login.png);
            background-color: rgba(0, 0, 0, 0.6);
            background-size: cover;
            background-blend-mode: darken;
        }

        .title-text {
            color: red;
            font-weight: bold;
            font-size: 400%;
            position: relative;
            left: 50px;

        }

        .interactive-box {
            color: antiquewhite;
            background-color: red;
            padding: 10px;
            margin: 10px;
            display: inline-block;
            position: absolute;
            top: 1.5%;
            left: 91%;
            border-radius: 10%;
            font-size: 25px;
        }

        .input-style {
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

<body>
    <div class="title-text">
        Netflix
    </div>

    <div class="interactive-box">
        Entrar
    </div>

    <div style="text-align: center; margin-top: 20px; align-content: center;">
        <h1 style="color: white; font-size: 50px;">
            Filmes, séries e
            <br>muito mais, sem limites
        </h1>
        <p style="color: white; font-size: 30px;">
            A partir de R$ 20,90. Cancele quando quiser.
        </p>
        
        <p style="color: white;font-size: 30px;">
            Quer assistir? Informe seu email para criar ou reiniciar sua assinatura.
        </p>
    </div>
    <div class="input-style">
        <input type="text" placeholder="E-mail" size="100px" style="height: 40px; background-color: black; color: white;" >
    </div>
</body>

</html>
